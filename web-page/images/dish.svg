<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Тарелка спагетти с томатным соусом и базиликом">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe3c4"/>
            <stop offset="1" stop-color="#f7b57a"/>
        </linearGradient>
    </defs>

    <rect width="600" height="400" fill="url(#bg)"/>

    <!-- тень и тарелка -->
    <ellipse cx="300" cy="332" rx="200" ry="24" fill="#5a2d0c" opacity="0.15"/>
    <ellipse cx="300" cy="250" rx="210" ry="100" fill="#ffffff" stroke="#e5d3bf" stroke-width="4"/>
    <ellipse cx="300" cy="248" rx="160" ry="72" fill="#f7f1e7" stroke="#eadfcf" stroke-width="3"/>

    <!-- паста -->
    <g fill="none" stroke="#f2c14e" stroke-width="9" stroke-linecap="round">
        <path d="M185 245 C225 175, 375 175, 415 245"/>
        <path d="M200 255 C240 195, 360 195, 400 255"/>
        <path d="M215 235 C250 200, 350 200, 385 235"/>
        <path d="M195 260 C235 215, 365 215, 405 260"/>
        <path d="M225 250 C255 215, 345 215, 375 250"/>
    </g>
    <g fill="none" stroke="#e0a92f" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <path d="M205 240 C245 190, 355 190, 395 240"/>
        <path d="M220 258 C250 225, 350 225, 380 258"/>
    </g>

    <!-- томатный соус -->
    <ellipse cx="300" cy="222" rx="70" ry="30" fill="#d63a1e"/>
    <ellipse cx="285" cy="216" rx="30" ry="12" fill="#e9573a"/>
    <circle cx="320" cy="225" r="7" fill="#b92c14"/>
    <circle cx="268" cy="228" r="6" fill="#b92c14"/>
    <circle cx="302" cy="214" r="5" fill="#f07a5a"/>

    <!-- листья базилика -->
    <g fill="#3f8f3a">
        <ellipse cx="295" cy="200" rx="20" ry="9" transform="rotate(-25 295 200)"/>
        <ellipse cx="322" cy="203" rx="18" ry="8" transform="rotate(30 322 203)"/>
        <ellipse cx="308" cy="192" rx="14" ry="7" transform="rotate(-80 308 192)" fill="#53a84c"/>
    </g>
    <g stroke="#2b6a27" stroke-width="1.5" stroke-linecap="round">
        <line x1="280" y1="206" x2="310" y2="194"/>
        <line x1="310" y1="199" x2="334" y2="208"/>
    </g>

    <!-- вилка -->
    <g stroke="#9a9a9a" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="500" y1="130" x2="500" y2="190"/>
        <line x1="512" y1="130" x2="512" y2="190"/>
        <line x1="524" y1="130" x2="524" y2="190"/>
        <path d="M500 190 Q512 210 524 190"/>
        <line x1="512" y1="205" x2="512" y2="300"/>
    </g>
</svg>
